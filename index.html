<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>חתימה על מסמך</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#16181d; --muted:#6b7280;
    --line:#dfe3e8; --accent:#0b6b3a; --accent2:#0d8348;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
  main{max-width:760px;margin:0 auto;padding:14px 14px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:16px;margin-bottom:14px}
  h1{font-size:20px;margin:0 0 4px}
  h2{font-size:16px;margin:0 0 8px}
  .sub{color:var(--muted);font-size:14px;margin:0}
  .hint{color:var(--muted);font-size:14px;margin:6px 0 0}
  /* גובה מוגבל בכוונה: עמוד A4 מלא דוחף את לוח החתימה מתחת לקפל, ומי שלא מגלגל
     חושב שאין מה לעשות. גלילה של המסמך קורית בתוך המסגרת. */
  .docScroll{max-height:44vh;overflow:auto;-webkit-overflow-scrolling:touch;
             border:1px solid var(--line);border-radius:10px;background:#fff}
  .docWrap{position:relative;line-height:0}
  .docWrap img{width:100%;height:auto;display:block}
  .docWrap canvas{position:absolute;inset:0;width:100%;height:100%}
  /* הגובה נקבע מהפרופורציה של מקום החתימה במסמך (app.js קובע aspect-ratio) */
  #pad{width:100%;height:auto;min-height:78px;max-height:210px;background:#fffdf5;
       border:2px dashed #c9ced6;border-radius:10px;touch-action:none;display:block}
  #pad.has{border-style:solid;border-color:var(--accent)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  button,.btn{flex:1 1 auto;min-height:52px;padding:12px 16px;font-size:16px;
       font-family:inherit;border-radius:10px;border:1px solid var(--line);
       background:#fff;color:var(--ink);cursor:pointer;text-align:center;
       text-decoration:none;display:flex;align-items:center;justify-content:center}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:disabled{background:#b9c2bd;border-color:#b9c2bd;cursor:default}
  .ok{background:#e8f6ee;border:1px solid #bfe3cd;color:#0b5a31;
      border-radius:10px;padding:12px;font-weight:600}
  .warn{background:#fff6e5;border:1px solid #f0dcb0;color:#6b4e10;
        border-radius:10px;padding:12px;font-size:14px}
  .foot{color:var(--muted);font-size:13px;text-align:center;margin:18px 0 0}
  .hide{display:none!important}
  #err{background:#fdecec;border:1px solid #f3c2c2;color:#8a1f1f;
       border-radius:10px;padding:14px}
  @media (prefers-color-scheme: dark){
    :root{--bg:#14161a;--card:#1c1f25;--ink:#eceef2;--muted:#9aa2ae;--line:#2c313a}
    button,.btn{background:#232830;color:var(--ink)}
    #pad{background:#f7f7f2}
    .ok{background:#12321f;border-color:#1f5c38;color:#a7e0bd}
    .warn{background:#332a14;border-color:#5c4a1f;color:#e8d3a0}
  }
</style>
</head>
<body>
<main>
  <div id="loading" class="card">טוען את המסמך...</div>

  <div id="err" class="hide"></div>

  <div id="app" class="hide">
    <div class="card">
      <h1 id="docTitle">מסמך לחתימה</h1>
      <p class="sub" id="docSub"></p>
    </div>

    <div class="card">
      <h2>1. המסמך</h2>
      <div class="docScroll">
        <div class="docWrap">
          <img id="preview" alt="תצוגה מקדימה של המסמך">
          <canvas id="overlay"></canvas>
        </div>
      </div>
      <p class="hint">גוללים בתוך המסגרת כדי לקרוא הכל.</p>
    </div>

    <div class="card" id="signStep">
      <h2>2. החתימה שלך</h2>
      <p class="hint" style="margin-bottom:10px">חתמו באצבע בתוך המסגרת.</p>
      <canvas id="pad"></canvas>
      <div class="row">
        <button id="clearBtn">מחיקה וחתימה מחדש</button>
        <button id="signBtn" class="primary" disabled>אישור החתימה</button>
      </div>
    </div>

    <div class="card hide" id="doneStep">
      <div class="ok">החתימה נוספה למסמך. נשאר רק לשלוח אותו חזרה.</div>
      <h2 style="margin-top:14px">3. שליחה חזרה</h2>
      <div class="row">
        <button id="shareBtn" class="primary">שליחה חזרה בוואטסאפ או במייל</button>
      </div>
      <a id="mailBtn" class="btn hide" style="margin-top:10px">שליחה במייל</a>
      <div class="row">
        <button id="viewBtn">פתיחת הקובץ לצפייה</button>
        <button id="dlBtn">שמירה במכשיר</button>
      </div>
      <p class="hint" id="doneHint"></p>
      <div class="row"><button id="againBtn">לחתום מחדש</button></div>
    </div>

    <p class="foot">החתימה מתבצעת במכשיר שלכם, המסמך לא נשלח לשום שרת.</p>
  </div>
</main>
<script type="module" src="app.js?v=3"></script>
</body>
</html>
